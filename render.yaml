services:
  - type: web
    name: group22-coordination-board
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Force the host to configure a team password before the board will open.
      - key: REQUIRE_PASSCODE
        value: "1"
      - key: BOARD_PASSCODE
        sync: false
      # Turso cloud SQLite (free tier, no credit card required) so board data
      # persists across Render sleeps and redeploys.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Default AI provider/key supplied by the link host (teammates can still
      # enter their own key in the browser without affecting anyone else).
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
